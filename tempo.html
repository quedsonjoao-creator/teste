<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frasco de Motivos para te mostrar o quao importante és 
        </title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #181824 0%, #09090c 100%);
            color: #e1e1e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(22, 22, 32, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0px 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 92, 138, 0.4);
            padding: 24px;
            margin-top: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        .header {
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 1.2rem;
            color: #ff5c8a;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .header p {
            font-size: 0.75rem;
            color: #a8a8b3;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            color: #a8a8b3;
            font-weight: 500;
            font-size: 0.8rem;
            transition: 0.2s;
            float: left;
        }
        .back-btn:hover {
            color: #fff;
        }
        /* Ilustração do Frasco */
        .jarro-container {
            position: relative;
            width: 140px;
            height: 180px;
            margin: 20px auto;
            background: rgba(255, 92, 138, 0.05);
            border: 3px solid rgba(255, 92, 138, 0.4);
            border-radius: 20px 20px 35px 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(255, 92, 138, 0.1);
            transition: transform 0.2s;
        }
        .jarro-container:hover {
            transform: scale(1.03);
            border-color: #ff5c8a;
        }
        .jarro-tampa {
            position: absolute;
            top: -12px;
            width: 70px;
            height: 12px;
            background: #ff5c8a;
            border-radius: 6px;
        }
        .jarro-icone {
            font-size: 3rem;
            animation: flutuar 2s ease-in-out infinite;
        }
        @keyframes flutuar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .instrucao {
            font-size: 0.75rem;
            color: #ff8fa3;
            margin-bottom: 20px;
        }
        /* Papelinho / Mensagem Sorteada */
        .papelinho-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 92, 138, 0.4);
            border-radius: 16px;
            padding: 18px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            animation: fadeIn 0.4s ease;
        }
        .papelinho-card p {
            font-size: 0.85rem;
            color: #fff;
            line-height: 1.5;
            font-style: italic;
        }
        .btn-tirar {
            background: linear-gradient(135deg, #ff5c8a, #ff3366);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 92, 138, 0.3);
            transition: 0.2s;
        }
        .btn-tirar:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">← Voltar</a>
        <div style="clear: both;"></div>
        
        <div class="header">
            <h1>Frasco do Amor</h1>
            <p>Um potinho cheio de razões pelas quais te tornam tão especial </p>
        </div>

        <!-- Jarro Virtual -->
        <div class="jarro-container" onclick="tirarPapelinho()">
            <div class="jarro-tampa"></div>
            <div class="jarro-icone">💖</div>
        </div>

        <p class="instrucao">Clica no frasco ou no botão abaixo para tirar um papelinho!</p>

        <!-- Papelinho com a frase -->
        <div class="papelinho-card">
            <p id="mensagemPapel">"Clica para descobrires um motivo especial..."</p>
        </div>

        <button class="btn-tirar" onclick="tirarPapelinho()">✨ Retirar Novo Papelinho</button>
    </div>

    <script>
        // Podes adicionar, remover ou alterar os motivos aqui à vontade!
        const motivos = [
            " O seu sorriso.",
            "A tua paciência e o teu carinho mesmo quando eu sou muito chato.",
            "Seu estresse em determinadas situações.",
            "O brilho que tens nos olhos quando falas daquilo que tu amas",
            "A sua sabedoria com as palavras",
            "A tua inteligência e a garra com que vais atrás dos teus objetivos.",
            "A sua atenção .",
            "O seu jeito de falar. ",
            "Saber que posso contar contigo para absolutamente tudo.",
        
        ];

        function tirarPapelinho() {
            const indiceAleatorio = Math.floor(Math.random() * motivos.length);
         const textoElemento = document.getElementById("mensagemPapel");
            
            // Pequeno efeito visual de transição
            textoElemento.style.opacity = 0;
            setTimeout(() => {
                textoElemento.innerText = `"${motivos[indiceAleatorio]}"`;
                textoElemento.style.opacity = 1;
            }, 200);
        }
    </script>
</body>
</html>
