<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frase do Dia 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #181824 0%, #09090c 100%);
            color: #e1e1e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        /* Notificação simulada no topo */
        .notificacao-banner {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(30, 30, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 92, 138, 0.5);
            padding: 14px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: deslizarNotificacao 5s ease forwards;
        }

        @keyframes deslizarNotificacao {
            0% { top: -80px; opacity: 0; }
            15% { top: 20px; opacity: 1; }
            85% { top: 20px; opacity: 1; }
            100% { top: -80px; opacity: 0; }
        }

        .notif-icone {
            font-size: 1.5rem;
            background: rgba(255, 92, 138, 0.2);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .notif-texto h4 {
            font-size: 0.8rem;
            color: #ff5c8a;
            font-weight: 600;
        }

        .notif-texto p {
            font-size: 0.75rem;
            color: #c7c7cf;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(22, 22, 32, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0px 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 92, 138, 0.3);
            padding: 30px 24px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #a8a8b3;
            font-weight: 500;
            font-size: 0.8rem;
            transition: 0.2s;
            float: left;
        }
        .back-btn:hover {
            color: #fff;
        }

        .header-icone {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: pulsar 2s infinite ease-in-out;
        }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-size: 1.3rem;
            color: #ff5c8a;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .data-hoje {
            font-size: 0.75rem;
            color: #8e8e99;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .frase-card {
            background: rgba(255, 92, 138, 0.05);
            border: 1px dashed rgba(255, 92, 138, 0.3);
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 25px;
            position: relative;
        }

        .frase-card p {
            font-size: 0.92rem;
            color: #e1e1e6;
            line-height: 1.7;
            font-weight: 400;
            font-style: italic;
        }

        .btn-coracao {
            background: linear-gradient(135deg, #ff5c8a, #ff3366);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 20px rgba(255, 92, 138, 0.4);
        }

        .btn-coracao:hover {
            transform: translateY(-2px);
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(255, 92, 138, 0.6);
        }

        .contador-dias {
            margin-top: 15px;
            font-size: 0.72rem;
            color: #8e8e99;
        }
    </style>
</head>
<body>

    <!-- Banner simulando notificação push -->
    <div class="notificacao-banner">
        <div class="notif-icone">💌</div>
        <div class="notif-texto">
            <h4>Nova Mensagem de Amor</h4>
            <p>Tens uma frase especial esperando por ti hoje!</p>
        </div>
    </div>

    <div class="container">
        <a href="index.html" class="back-btn">← Voltar</a>
        <div style="clear: both;"></div>

        <div class="header-icone">✨</div>
        <h1>Frase do Dia</h1>
        <div class="data-hoje" id="dataAtual">Carregando data...</div>

        <div class="frase-card">
            <p id="fraseTexto">"A carregar o teu mimo de hoje..."</p>
        </div>

        <button class="btn-coracao" onclick="mostrarFraseAleatoria()">Sortear Outra Frase 💖</button>
        
        <div class="contador-dias" id="infoFrases">Mensagem única diária</div>
    </div>

    <script>
        // Lista com várias frases e elogios fofos
        const listaFrases = [
            "Minha querida Bebea, lembra-te hoje (e sempre) que és a pessoa mais incrível, iluminada e importante na vida de todos.",
            "Voce é uma obra prima que Deus planejou",
            "O teu sorriso tem a capacidade de transfromar qualquer coisa ruim em boa. ",
            "Os brilhos de seus olhos sao como a luz que enclarece qualquer lugar",
            "Voce é perfeita aos olhos do Pai",
            
        ];

        // Mostra a data formatada de hoje
        function atualizarData() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const hoje = new Date();
            document.getElementById("dataAtual").innerText = hoje.toLocaleDateString('pt-BR', options);
        }

        // Seleciona a frase com base no dia do ano (muda automaticamente todos os dias)
        function carregarFraseDoDia() {
            const agora = new Date();
            const inicioAno = new Date(agora.getFullYear(), 0, 0);
            const diff = agora - inicioAno;
            const umDia = 1000 * 60 * 60 * 24;
            const diaDoAno = Math.floor(diff / umDia);

            // Usa o dia do ano para escolher uma frase da lista de forma cíclica
            const indiceFrase = diaDoAno % listaFrases.length;
            document.getElementById("fraseTexto").innerText = `"${listaFrases[indiceFrase]}"`;
        }

        // Função caso ela queira clicar no botão para ver outra frase de surpresa
        function mostrarFraseAleatoria() {
            const randomIndex = Math.floor(Math.random() * listaFrases.length);
            document.getElementById("fraseTexto").style.opacity = 0;
            setTimeout(() => {
                document.getElementById("fraseTexto").innerText = `"${listaFrases[randomIndex]}"`;
                document.getElementById("fraseTexto").style.opacity = 1;
            }, 200);
        }

        window.onload = () => {
            atualizarData();
            carregarFraseDoDia();
        };
    </script>
</body>
</html>
