<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Mundo Dela 💖</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #181824 0%, #09090c 100%);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 440px; width: 100%; background: rgba(22, 22, 32, 0.95); backdrop-filter: blur(16px);
            padding: 24px; border-radius: 32px; box-shadow: 0px 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 92, 138, 0.4);
        }
        h1 { color: #ff5c8a; font-size: 1.2rem; margin-bottom: 5px; }
        p.sub { font-size: 0.75rem; color: #a8a8b3; margin-bottom: 20px; }

        /* Grade de Itens Favoritos */
        .grid-gostos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }
        .card-gosto {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 92, 138, 0.2);
            padding: 14px;
            border-radius: 16px;
            transition: all 0.2s;
        }
        .card-gosto:hover {
            border-color: #ff5c8a;
            background: rgba(255, 92, 138, 0.08);
            transform: translateY(-2px);
        }
        .gosto-icone {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        .gosto-titulo {
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }
        .gosto-desc {
            font-size: 0.68rem;
            color: #b8b8c2;
            line-height: 1.3;
        }

        .btn-voltar {
            display: block; width: 100%; background: transparent; color: #a8a8b3; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px; border-radius: 12px; font-size: 0.8rem; text-align: center;
            text-decoration: none; transition: all 0.2s;
        }
        .btn-voltar:hover { color: #fff; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="container">
        <h1>💖 O Mundo Dela</h1>
        <p class="sub">Guia oficial de tudo o que torna a  muito mais feliz!</p>

        <div class="grid-gostos">
            <!-- Item 1 -->
            <div class="card-gosto">
                <div class="gosto-icone"> Deus e a familia </div>
                <div class="gosto-titulo"></div>
                <div class="gosto-desc"></div>
            </div>

            <!-- Item 2 -->
            <div class="card-gosto">
                <div class="gosto-icone"> Andar de Patinete </div>
                <div class="gosto-titulo"></div>
                <div class="gosto-desc"></div>
            </div>

            <!-- Item 3 -->
            <div class="card-gosto">
                <div class="gosto-icone"> DEvocional escutando musica </div>
                <div class="gosto-titulo">  </div>
                <div class="gosto-desc"></div>
            </div>

            <!-- Item 4 -->
            <div class="card-gosto">
                <div class="gosto-icone">Açai</div>
                <div class="gosto-titulo"></div>
                <div class="gosto-desc"></div>
            </div>

            <!-- Item 5 -->
            <div class="card-gosto">
                <div class="gosto-icone">Sua Priminha</div>
                <div class="gosto-titulo"></div>
                <div class="gosto-desc"></div>
            </div>

            <!-- Item 6 -->
            <div class="card-gosto">
                <div class="gosto-icone">Assistir</div>
                <div class="gosto-titulo"></div>
                <div class="gosto-desc"></div>
            </div>
        </div>

        <a href="index.html" class="btn-voltar">← Voltar para o Catálogo</a>
    </div>

</body>
</html>
