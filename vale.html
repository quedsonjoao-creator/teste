<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Vale Resgatado! 🎟️✨</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #181824 0%, #09090c 100%);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 420px; width: 100%; background: rgba(22, 22, 32, 0.9); backdrop-filter: blur(16px);
            padding: 35px 25px; border-radius: 32px; box-shadow: 0px 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 92, 138, 0.4); animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        h1 { color: #ff5c8a; font-size: 1.5rem; margin-bottom: 10px; }
        p { font-size: 0.9rem; color: #a8a8b3; margin-bottom: 25px; line-height: 1.5; }
        
        .vale-card {
            background: linear-gradient(135deg, rgba(255, 92, 138, 0.15), rgba(120, 40, 90, 0.2));
            border: 2px dashed #ff5c8a; padding: 25px 20px; border-radius: 20px; margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(255, 92, 138, 0.2);
        }
        .vale-card h2 { font-size: 1.2rem; color: #fff; margin-bottom: 8px; }
        .vale-card span { font-size: 0.78rem; color: #ff8fa3; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

        .btn-acao {
            display: block; width: 100%; background: linear-gradient(135deg, #ff5c8a, #ff3366); color: white;
            border: none; padding: 12px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            text-decoration: none; font-family: 'Poppins', sans-serif; box-shadow: 0 4px 15px rgba(255,92,138,0.4);
            transition: all 0.2s; margin-bottom: 12px;
        }
        .btn-acao:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,92,138,0.6); }

        .btn-voltar {
            background: transparent; color: #a8a8b3; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px; border-radius: 14px; font-size: 0.85rem; width: 100%; cursor: pointer;
            text-decoration: none; display: block; font-family: 'Poppins', sans-serif; transition: all 0.2s;
        }
        .btn-voltar:hover { color: #fff; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Parabéns, meu amor! 🎉</h1>
        <p>Você conquistou pontos suficientes e desbloqueou um vale especial:</p>

        <div class="vale-card">
            <span>🎟️ Vale Oficial Resgatado</span>
            <h2 id="nome-vale">Carregando vale...</h2>
        </div>

        <!-- Botão para enviar direto pro seu WhatsApp -->
        <a id="link-whatsapp" href="#" target="_blank" class="btn-acao">📲 Enviar Vale para o WhatsApp dele(a)</a>
        
        <a href="index.html" class="btn-voltar">← Voltar para o início</a>
    </div>

    <script>
        // DISPARAR CONFETES AO ENTRAR NA PÁGINA
        confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });

        // PEGAR OS DADOS DA URL (NOME DO VALE)
        const urlParams = new URLSearchParams(window.location.search);
        const nomeVale = urlParams.get('nome') || "Vale Surpresa";

        document.getElementById("nome-vale").innerText = nomeVale;

        // ⚠️ MUDE AQUI O SEU NÚMERO DE TELEFONE (com DDI e DDD, ex: 5511999999999)
        const meuNumeroWhatsApp = "5561991181653"; 

        // Montar a mensagem automática para o WhatsApp
        const mensagem = encodeURIComponent(`Oii, amor! 💖 Acabei de resgatar o vale no site: *"${nomeVale}"*. Já pode ir preparando! 🥰✨`);
        
        // Atribuir o link do WhatsApp no botão
        document.getElementById("link-whatsapp").href = `https://api.whatsapp.com/send?phone=${meuNumeroWhatsApp}&text=${mensagem}`;
    </script>
</body>
</html>
