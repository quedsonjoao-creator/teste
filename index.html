<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para você, com amor 🖤✨</title>
    <style>
        body {
            background-color: #121214;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #1a1a1e;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0px 15px 35px rgba(0,0,0,0.5);
            border: 1px solid #2d2d35;
        }
        .coracao-icone {
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: pulsar 1.5s infinite;
        }
        @keyframes pulsar {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        h1 {
            color: #ff6584;
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 1.05rem;
            color: #a8a8b3;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .botoes {
            margin-top: 35px;
            position: relative;
            height: 50px;
        }
        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #sim {
            background-color: #ff6584;
            color: #121214;
            box-shadow: 0px 4px 15px rgba(255, 101, 132, 0.3);
        }
        #sim:hover {
            background-color: #ff476f;
            transform: scale(1.05);
        }
        #nao {
            background-color: #2d2d35;
            color: #a8a8b3;
            position: absolute;
            margin-left: 20px;
        }
        #mensagem-surpresa {
            display: none;
            margin-top: 25px;
            font-size: 1.2rem;
            color: #ff6584;
            font-weight: bold;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="coracao-icone">🖤</div>
        <h1>Hey, BEBEA!</h1>
        <p>Saiba que você e preciosa pra DEUS e que ele te ama muitoooo!! E também você és muito preciosa pra todos nós que conhcecemos você, tenho certezaa que voce é mt amada</p>
        <p>Você aceita continuar recebendo as mensagens por aqui?</p>

        <div class="botoes">
            <button class="btn" id="sim" onclick="clicouSim()">Sim! 🥰</button>
            <button class="btn" id="nao" onmouseover="foge()" onclick="foge()">Não 🙈</button>
        </div>

        <div id="mensagem-surpresa">
            Yeeeei! Sabia que você ia dizer que sim! Incrivel vocÊ!!
        </div>
    </div>

    <script>
        function foge() {
            var botaoNao = document.getElementById("nao");
            var larguraJanela = window.innerWidth - 120;
            var alturaJanela = window.innerHeight - 120;
            
            var aleatorioX = Math.random() * larguraJanela;
            var aleatorioY = Math.random() * alturaJanela;
            
            botaoNao.style.position = "fixed";
            botaoNao.style.left = aleatorioX + "px";
            botaoNao.style.top = aleatorioY + "px";
        }

        function clicouSim() {
            document.getElementById("mensagem-surpresa").style.display = "block";
            document.getElementById("nao").style.display = "none";
        }
    </script>

</body>
</html>
