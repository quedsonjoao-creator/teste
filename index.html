<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para você, com todo o meu amor 🖤✨</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #181824 0%, #09090c 100%);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(22, 22, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 32px;
            box-shadow: 0px 25px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.07);
            position: relative;
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Foto de perfil com moldura brilhante */
        .foto-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .foto-perfil {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff5c8a;
            box-shadow: 0px 0px 25px rgba(255, 92, 138, 0.35);
        }

        .coracao-Badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #16161e;
            border: 2px solid #ff5c8a;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            animation: pulsar 2s infinite;
        }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            color: #ff5c8a;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        p {
            font-size: 0.95rem;
            color: #a8a8b3;
            line-height: 1.7;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* Bloco do Contador de Tempo */
        .contador-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 18px;
            border-radius: 16px;
            margin: 25px 0;
            font-size: 0.9rem;
            color: #ff8fa3;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Seção de Botões */
        .botoes-area {
            margin-top: 30px;
            position: relative;
            height: 55px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 0.95rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.25s ease;
        }

        #sim {
            background: linear-gradient(135deg, #ff5c8a, #ff3366);
            color: #ffffff;
            box-shadow: 0px 8px 20px rgba(255, 92, 138, 0.4);
        }

        #sim:hover {
            transform: translateY(-2px);
            box-shadow: 0px 12px 25px rgba(255, 92, 138, 0.6);
        }

        #nao {
            background-color: rgba(255, 255, 255, 0.06);
            color: #a8a8b3;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: absolute;
        }

        #nao:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Mensagem de sucesso oculta */
        #mensagem-surpresa {
            display: none;
            margin-top: 25px;
            font-size: 1.05rem;
            color: #ff5c8a;
            font-weight: 500;
            animation: fadeIn 0.6s ease-in-out forwards;
            background: rgba(255, 92, 138, 0.08);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 92, 138, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="foto-wrapper">
            <img src="WhatsApp%20Image%202026-09-02%20at%2010.41.53.jpeg">
            <div class="coracao-Badge">🖤</div>
        </div>
        
        <h1>Para a Bebea </h1>
        
        <p>Fiz esse espacinho aqui só para te lembrar o quanto você é incrível, e que voce tenha um ótimo dia hoje e que se precisa saber que to aqui pra voce </p>

        <div class="contador-box" id="contador-tempo">
            <span>✨</span> <span id="texto-contador">Calculando nossos momentos juntos...</span>
        </div>

        <p>Deseja receber mais?</p>

        <div class="botoes-area">
            <button class="btn" id="sim" onclick="clicouSim()">Sim! </button>
            <button class="btn" id="nao" onmouseover="foge()" onclick="foge()">Não 🙈</button>
        </div>

        <div id="mensagem-surpresa">
            Yeeeei! Sabia que você ia dizer que sim! 
        </div>
    </div>

    <script>
        // --- CONTADOR DE DIAS (Altere a data aqui se quiser: Ano, Mês-1, Dia) ---
        var dataInicio = new Date(2026, 2, 1); 

        function atualizarContador() {
            var agora = new Date();
            var diferenca = agora - dataInicio;
            var dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
            
            document.getElementById("texto-contador").innerText = 
                " Te conhecendo há " + dias + " e cada vez fortalecendo a comunhão e descobrindo quão incrivel voce é!";
        }
        atualizarContador();

        // --- BOTÃO FUGIR ---
        function foge() {
            var botaoNao = document.getElementById("nao");
            var larguraJanela = window.innerWidth - 120;
            var alturaJanela = window.innerHeight - 120;
            
            var aleatorioX = Math.random() * larguraJanela;
            var aleatorioY = Math.random() * alturaJanela;
            
            botaoNao.style.position = "fixed";
            botaoNao.style.left = aleatorioX + "px";
            botaoNao.style.top = aleatorioY + "px";
        }

        // --- CLICAR EM SIM ---
        function clicouSim() {
            document.getElementById("mensagem-surpresa").style.display = "block";
            document.getElementById("nao").style.display = "none";
        }
    </script>

</body>
</html>
