<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Cantinho Especial </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FDFBF7',
                        softPink: '#FBE4E8',
                        warmLilac: '#E8E5F3',
                        goldGlow: '#D4AF37',
                        dustyRose: '#D9828A',
                        deepRose: '#9E4B55'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        hand: ['Caveat', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #FDFBF7 0%, #FBE4E8 50%, #E8E5F3 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #4A4A4A;
        }

        /* Efeito de Cursor de Máquina de Escrever */
        .typewriter-cursor {
            display: inline-block;
            width: 3px;
            background-color: #D9828A;
            animation: blink 0.8s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Caderninho Aesthetic com Linhas Guia */
        .notepad-paper {
            background-color: #FFFFFF;
            background-image: linear-gradient(#f1e6e8 1px, transparent 1px);
            background-size: 100% 2rem;
            box-shadow: 0 10px 30px -5px rgba(217, 130, 138, 0.15), 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* Sparkles & partículas */
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            animation: fadeFloat 1.2s ease-out forwards;
        }

        @keyframes fadeFloat {
            0% {
                opacity: 1;
                transform: scale(0.5) translateY(0);
            }
            100% {
                opacity: 0;
                transform: scale(1.4) translateY(-20px);
            }
        }

        /* Botões customizados */
        .btn-aesthetic {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(217, 130, 138, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-aesthetic:hover {
            background: rgba(251, 228, 232, 0.9);
            border-color: rgba(217, 130, 138, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(217, 130, 138, 0.2);
        }

        /* Estilo da barra de rolagem */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FDFBF7;
        }
        ::-webkit-scrollbar-thumb {
            background: #FBE4E8;
            border-radius: 10px;
        }
    </style>
</head>
<body class="relative font-sans flex flex-col justify-between min-h-screen selection:bg-softPink selection:text-deepRose">

    <!-- Fundo de Brilhos Flutuantes -->
    <div id="bg-sparkles" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- CABEÇALHO DELICADO -->
    <header class="pt-8 pb-4 text-center z-10 px-4">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/60 backdrop-blur-md border border-dustyRose/20 text-xs font-medium text-deepRose shadow-sm mb-3">
            <i class="fa-solid fa-sparkles text-goldGlow animate-pulse"></i>
            <span>Um gesto simples pra adoçar seu dia</span>
        </div>
        <h1 class="font-serif text-3xl md:text-5xl text-deepRose font-normal tracking-wide">
            Cantinho das Palavras ✨
        </h1>
    </header>

    <!-- MÚSICA PLAYER MINIMALISTA (FIXO OU FLUTUANTE NO CANTO) -->
    <div class="fixed bottom-5 right-5 z-40">
        <div class="bg-white/80 backdrop-blur-md p-3 rounded-full border border-dustyRose/30 shadow-lg flex items-center gap-3 pr-5">
            <button id="music-toggle" class="w-10 h-10 rounded-full bg-softPink text-deepRose flex items-center justify-center hover:scale-105 transition shadow-sm">
                <i class="fa-solid fa-music text-sm" id="music-icon"></i>
            </button>
            <div class="text-left hidden sm:block">
                <p class="text-xs font-bold text-gray-700 leading-tight">Melodia Suave</p>
                <p class="text-[10px] text-gray-500" id="music-status">Clique para ouvir</p>
            </div>
        </div>
        <!-- Áudio em tom relaxante de piano sem copyright -->
        <audio id="bg-music" loop>
            <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-piano-100-bpm-121529.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- CONTEÚDO PRINCIPAL (ÁREA CENTRAL) -->
    <main class="max-w-2xl w-full mx-auto px-4 py-6 z-10 flex-grow flex flex-col justify-center">

        <!-- PAINEL DE SELEÇÃO DE FRASES -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="selectPreset(0)" class="btn-aesthetic text-xs py-2 px-4 rounded-full text-gray-700 font-medium">
                🌸 Sorriso
            </button>
            <button onclick="selectPreset(1)" class="btn-aesthetic text-xs py-2 px-4 rounded-full text-gray-700 font-medium">
                ✨ Inspiração
            </button>
            <button onclick="selectPreset(2)" class="btn-aesthetic text-xs py-2 px-4 rounded-full text-gray-700 font-medium">
                ☕ Pausa no dia
            </button>
            <button onclick="toggleCustomEditor()" class="btn-aesthetic text-xs py-2 px-4 rounded-full text-deepRose font-semibold border-dustyRose/50">
                ✏️ Escrever o Meu
            </button>
        </div>

        <!-- EDITOR DE TEXTO PERSONALIZADO (INICIALMENTE OCULTO) -->
        <div id="custom-editor" class="hidden mb-6 bg-white/90 backdrop-blur-md p-4 rounded-2xl border border-dustyRose/30 shadow-sm">
            <label class="block text-xs font-bold text-gray-600 mb-2">Escreva sua própria mensagem para ela:</label>
            <textarea id="custom-text-input" rows="3" class="w-full text-sm p-3 rounded-xl border border-rose-100 focus:outline-none focus:ring-2 focus:ring-dustyRose/40 text-gray-700" placeholder="Digite aqui o texto que a maquininha irá digitar..."></textarea>
            <div class="flex justify-end gap-2 mt-2">
                <button onclick="toggleCustomEditor()" class="text-xs text-gray-500 hover:text-gray-700 px-3 py-1.5">Cancelar</button>
                <button onclick="applyCustomText()" class="text-xs bg-dustyRose text-white font-semibold px-4 py-1.5 rounded-lg shadow-sm hover:bg-deepRose transition">Digitar Mensagem</button>
            </div>
        </div>

        <!-- CADERNINHO / CARTA DE MÁQUINA DE ESCREVER -->
        <div class="notepad-paper rounded-3xl p-6 sm:p-10 border border-dustyRose/20 relative overflow-hidden">
            
            <!-- Detalhe decorativo de clipe / selo -->
            <div class="absolute top-4 right-6 text-dustyRose/40 text-xl">
                <i class="fa-solid fa-paperclip"></i>
            </div>

            <!-- Título da Carta -->
            <div class="mb-4 pb-2 border-b border-dustyRose/20 flex items-center justify-between">
                <span class="font-hand text-2xl text-deepRose font-bold" id="note-header">Pra te fazer sorrir...</span>
                <div class="flex items-center gap-1 text-goldGlow text-xs">
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </div>
            </div>

            <!-- ÁREA ONDE O TEXTO É DIGITADO -->
            <div class="min-h-[160px] sm:min-h-[180px] flex items-start">
                <p id="typewriter-output" class="font-serif text-lg sm:text-2xl text-gray-800 leading-relaxed tracking-wide font-normal"></p>
                <span id="cursor" class="typewriter-cursor text-lg sm:text-2xl">&nbsp;</span>
            </div>

            <!-- CONTROLES DA MÁQUINA DE ESCREVER -->
            <div class="mt-6 pt-4 border-t border-dustyRose/10 flex items-center justify-between text-xs text-gray-500">
                <div class="flex items-center gap-2">
                    <button id="btn-pause" onclick="togglePause()" class="hover:text-deepRose transition p-1" title="Pausar/Continuar">
                        <i class="fa-solid fa-pause" id="pause-icon"></i>
                    </button>
                    <button onclick="restartTypewriter()" class="hover:text-deepRose transition p-1" title="Reiniciar Digitação">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
                <span class="font-hand text-base text-dustyRose">Com carinho ✨</span>
            </div>
        </div>

        <!-- CANTINHO INTERATIVO: MINI CARTAS OCULTAS -->
        <div class="mt-10">
            <p class="text-center text-xs font-bold uppercase tracking-wider text-deepRose/70 mb-4">
                🎁 Pequenas surpresas para abrir
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button onclick="openNote('elogio')" class="btn-aesthetic p-4 rounded-2xl text-left flex items-center gap-3 group">
                    <div class="w-10 h-10 rounded-xl bg-softPink flex items-center justify-center text-dustyRose group-hover:scale-110 transition">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-gray-800">Abra se precisar de um elogio</p>
                        <p class="text-[11px] text-gray-500">Uma pequena verdade sobre você</p>
                    </div>
                </button>

                <button onclick="openNote('cansativo')" class="btn-aesthetic p-4 rounded-2xl text-left flex items-center gap-3 group">
                    <div class="w-10 h-10 rounded-xl bg-warmLilac flex items-center justify-center text-deepRose group-hover:scale-110 transition">
                        <i class="fa-solid fa-mug-hot"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-gray-800">Abra se o dia estiver cansativo</p>
                        <p class="text-[11px] text-gray-500">Um abraço em forma de mensagem</p>
                    </div>
                </button>
            </div>
        </div>

    </main>

    <!-- RODAPÉ SUTIL -->
    <footer class="py-6 text-center text-xs text-gray-400 z-10">
        <p>Feito para iluminar o seu dia • ✨</p>
    </footer>

    <!-- MODAL PARA EXIBIR AS MINI CARTAS OCULTAS -->
    <div id="modal-note" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-rose-100 transform scale-95 transition-all duration-300" id="modal-card">
            <div class="w-12 h-12 bg-softPink text-dustyRose rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-heart" id="modal-icon"></i>
            </div>
            <h3 class="font-serif text-xl font-bold text-gray-800 mb-3" id="modal-title">Mensagem Secreta</h3>
            <p class="text-sm text-gray-600 leading-relaxed mb-6 font-sans" id="modal-text"></p>
            <button onclick="closeNote()" class="w-full bg-dustyRose hover:bg-deepRose text-white font-semibold py-2.5 rounded-xl shadow-md transition text-xs">
                Guardar no coração ✨
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT DOS EFEITOS E INTERAÇÕES -->
    <script>
        // --- PRESETS DE FRASES LEVES E FLERTANTES (SEM PEDIDO DE NAMORO) ---
        const presets = [
            {
                header: "Razões do meu sorriso...",
                text: "Reparei que sempre que uma notificação sua chega, meu dia melhora instantaneamente uns 100%. Seu jeito leve é contagiante."
            },
            {
                header: "Apenas um lembrete...",
                text: "Não sei se já te disseram isso hoje, mas você tem uma energia incrível e um brilho único que é impossível não notar."
            },
            {
                header: "Pausa ",
                text: "Se o seu dia estiver corrido, respire fundo! Criei este cantinho só pra te lembrar de dar uma pausinha e sorrir, e te lembra que voce e incrivel."
            }
        ];

        let currentText = presets[0].text;
        let charIndex = 0;
        let isTyping = false;
        let isPaused = false;
        let typingTimeout = null;
        const speed = 55; // Velocidade da digitação em ms

        const outputElement = document.getElementById('typewriter-output');
        const headerElement = document.getElementById('note-header');
        const pauseIcon = document.getElementById('pause-icon');

        // --- MÁQUINA DE ESCREVER ---
        function startTypewriter(text, header) {
            clearTimeout(typingTimeout);
            currentText = text;
            if (header) headerElement.textContent = header;
            outputElement.textContent = '';
            charIndex = 0;
            isTyping = true;
            isPaused = false;
            updatePauseIcon();
            typeNextChar();
        }

        function typeNextChar() {
            if (isPaused) return;

            if (charIndex < currentText.length) {
                outputElement.textContent += currentText.charAt(charIndex);
                charIndex++;
                
                // Adiciona um variação natural de velocidade na digitação
                const randomSpeed = speed + Math.floor(Math.random() * 30) - 10;
                typingTimeout = setTimeout(typeNextChar, randomSpeed);
            } else {
                isTyping = false;
            }
        }

        function togglePause() {
            if (!isTyping && charIndex >= currentText.length) return;
            isPaused = !isPaused;
            updatePauseIcon();
            if (!isPaused) typeNextChar();
        }

        function updatePauseIcon() {
            pauseIcon.className = isPaused ? "fa-solid fa-play" : "fa-solid fa-pause";
        }

        function restartTypewriter() {
            startTypewriter(currentText);
        }

        function selectPreset(index) {
            startTypewriter(presets[index].text, presets[index].header);
        }

        // --- EDITOR CUSTOMIZADO ---
        function toggleCustomEditor() {
            const editor = document.getElementById('custom-editor');
            editor.classList.toggle('hidden');
        }

        function applyCustomText() {
            const customInput = document.getElementById('custom-text-input').value.trim();
            if (customInput) {
                startTypewriter(customInput, "Sua Mensagem Especial ✨");
                toggleCustomEditor();
            }
        }

        // --- BRILHOS / SPARKLES AO MOVER O MOUSE ---
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.85) { // Controla a densidade das estrelinhas
                createSparkle(e.clientX, e.clientY);
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('i');
            const icons = ['fa-star', 'fa-sparkles', 'fa-heart'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            
            sparkle.className = `fa-solid ${randomIcon} sparkle-particle text-xs`;
            sparkle.style.left = `${x + (Math.random() * 20 - 10)}px`;
            sparkle.style.top = `${y + (Math.random() * 20 - 10)}px`;
            
            // Cores sutis e elegantes
            const colors = ['#D4AF37', '#D9828A', '#FBE4E8', '#9E4B55'];
            sparkle.style.color = colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1200);
        }

        // --- CARTAS OCULTAS (MODAL) ---
        const secretNotes = {
            elogio: {
                title: "Um elogio sincero 🌸",
                text: "Você tem um senso de humor incrível e um jeito de conversar que deixa qualquer momento leve. É muito gostoso falar com você!",
                icon: "fa-smile-beam"
            },
            cansativo: {
                title: "Calma no coração ",
                text: "Se o dia esteve difícil, lembre-se de que você já superou 100% dos seus dias ruins até hoje. Tire o resto da noite pra relaxar, você merece! E sempre estarei aqui. E lembre-se que Jesus te ama.",
                icon: "fa-mug-hot"
            }
        };

        function openNote(type) {
            const note = secretNotes[type];
            document.getElementById('modal-title').textContent = note.title;
            document.getElementById('modal-text').textContent = note.text;
            document.getElementById('modal-icon').className = `fa-solid ${note.icon}`;
            
            const modal = document.getElementById('modal-note');
            const card = document.getElementById('modal-card');
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }, 10);
        }

        function closeNote() {
            const modal = document.getElementById('modal-note');
            modal.classList.add('hidden');
        }

        // --- CONTROLE DE MÚSICA ---
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');
        const musicIcon = document.getElementById('music-icon');
        const musicStatus = document.getElementById('music-status');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                musicIcon.className = "fa-solid fa-music";
                musicStatus.textContent = "Clique para ouvir";
            } else {
                audio.play();
                musicIcon.className = "fa-solid fa-pause";
                musicStatus.textContent = "Tocando melodia suave...";
            }
            isPlaying = !isPlaying;
        });

        // Inicializar a primeira frase ao carregar
        window.onload = () => {
            startTypewriter(presets[0].text, presets[0].header);
        };
    </script>
</body>
</html>
