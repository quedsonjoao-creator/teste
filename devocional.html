<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantinho Devocional</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #181824 0%, #09090c 100%);
            color: #e1e1e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(22, 22, 32, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0px 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 92, 138, 0.4);
            padding: 24px;
            margin-top: 15px;
            margin-bottom: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.2rem;
            color: #ff5c8a;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 0.75rem;
            color: #a8a8b3;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            color: #a8a8b3;
            font-weight: 500;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #fff;
        }
        .versiculo-card {
            background: rgba(255, 92, 138, 0.08);
            border-left: 4px solid #ff5c8a;
            padding: 14px 16px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 20px;
        }
        .versiculo-card h3 {
            font-size: 0.85rem;
            color: #ff8fa3;
            margin-bottom: 4px;
        }
        .versiculo-card p {
            font-size: 0.75rem;
            color: #d1d1d6;
            font-style: italic;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #c7c7cf;
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 92, 138, 0.2);
            border-radius: 12px;
            font-size: 0.8rem;
            outline: none;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
        }
        .form-control:focus {
            border-color: #ff5c8a;
            background: rgba(255, 92, 138, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 92, 138, 0.15);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }
        .btn-salvar {
            background: linear-gradient(135deg, #ff5c8a, #ff3366);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 92, 138, 0.3);
            margin-top: 5px;
        }
        .btn-salvar:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        .historico-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
            text-align: left;
        }
        .historico-section h2 {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 12px;
        }
        .devocional-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 92, 138, 0.2);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .devocional-item h4 {
            font-size: 0.85rem;
            color: #ff5c8a;
            margin-bottom: 2px;
        }
        .devocional-item .data-tag {
            font-size: 0.68rem;
            color: #9898a6;
            margin-bottom: 8px;
            display: block;
        }
        .devocional-item p {
            font-size: 0.75rem;
            color: #c7c7cf;
            margin-top: 4px;
            line-height: 1.4;
        }
        .empty-msg {
            text-align: center;
            color: #9898a6;
            font-size: 0.75rem;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">← Voltar para a Página Inicial</a>
        
        <div class="header">
            <h1>✨ Cantinho Devocional</h1>
            <p>Guarda aqui as tuas anotações, orações e o que Deus falar ao teu coração.</p>
        </div>

        <div class="versiculo-card">
            <h3>Versículo do Dia</h3>
            <p>"Entrega o teu caminho ao Senhor; confia nele, e ele o fará." — Salmos 37:5</p>
        </div>

        <form id="devocionalForm">
            <div class="form-group">
                <label for="titulo">Título / Tema do Dia</label>
                <input type="text" id="titulo" class="form-control" placeholder="Ex: Confiança e Paz" required>
            </div>

            <div class="form-group">
                <label for="versiculo">Versículo Chave</label>
                <input type="text" id="versiculo" class="form-control" placeholder="Ex: Filipenses 4:6-7" required>
            </div>

            <div class="form-group">
                <label for="anotacao">O que Deus falou ao meu coração?</label>
                <textarea id="anotacao" class="form-control" placeholder="Escreve as tuas reflexões aqui..." required></textarea>
            </div>

            <div class="form-group">
                <label for="oracao">Motivos de Oração / Gratidão</label>
                <textarea id="oracao" class="form-control" placeholder="Pedidos, intercessões e agradecimentos..."></textarea>
            </div>

            <button type="submit" class="btn-salvar">Salvar Devocional 📖</button>
        </form>

        <div class="historico-section">
            <h2>Meus Devocionais Salvos</h2>
            <div id="listaDevocionais">
                <!-- Os devocionais salvos aparecem aqui automaticamente -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", carregarDevocionais);

        const form = document.getElementById("devocionalForm");
        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const titulo = document.getElementById("titulo").value;
            const versiculo = document.getElementById("versiculo").value;
            const anotacao = document.getElementById("anotacao").value;
            const oracao = document.getElementById("oracao").value;
            
            const hoje = new Date();
            const dataFormatada = hoje.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });

            const novoDevocional = {
                id: Date.now(),
                titulo,
                versiculo,
                anotacao,
                oracao,
                data: dataFormatada
            };

            let devocionais = JSON.parse(localStorage.getItem("meus_devocionais")) || [];
            devocionais.unshift(novoDevocional);
            localStorage.setItem("meus_devocionais", JSON.stringify(devocionais));

            form.reset();
            carregarDevocionais();
        });

        function carregarDevocionais() {
            const lista = document.getElementById("listaDevocionais");
            let devocionais = JSON.parse(localStorage.getItem("meus_devocionais")) || [];

            if (devocionais.length === 0) {
                lista.innerHTML = '<div class="empty-msg">Nenhum devocional salvo ainda. Escreve o teu primeiro acima!</div>';
                return;
            }

            lista.innerHTML = "";
            devocionais.forEach(item => {
                const div = document.createElement("div");
                div.className = "devocional-item";
                div.innerHTML = `
                    <h4>${item.titulo}</h4>
                    <span class="data-tag">📅 ${item.data} | 📖 ${item.versiculo}</span>
                    <p><strong>Reflexão:</strong> ${item.anotacao}</p>
                    ${item.oracao ? `<p><strong>Oração/Gratidão:</strong> ${item.oracao}</p>` : ''}
                `;
                lista.appendChild(div);
            });
        }
    </script>
</body>
</html>
