<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas do Nosso Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #181824 0%, #09090c 100%);
            color: #e1e1e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(22, 22, 32, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            box-shadow: 0px 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 92, 138, 0.4);
            padding: 24px;
            margin-top: 15px;
            margin-bottom: 30px;
            text-align: center;
        }
        .header {
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.2rem;
            color: #ff5c8a;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .header p {
            font-size: 0.75rem;
            color: #a8a8b3;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            color: #a8a8b3;
            font-weight: 500;
            font-size: 0.8rem;
            transition: 0.2s;
            float: left;
        }
        .back-btn:hover {
            color: #fff;
        }
        
        /* Grelha de Estatísticas */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255, 92, 138, 0.04);
            border: 1px solid rgba(255, 92, 138, 0.2);
            border-radius: 20px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 92, 138, 0.5);
        }
        .stat-card.full-width {
            grid-column: span 2;
        }
        .stat-icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #a8a8b3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Destaque / Curiosidade extra */
        .destaque-card {
            background: linear-gradient(135deg, rgba(255, 92, 138, 0.1), rgba(255, 51, 102, 0.05));
            border: 1px dashed rgba(255, 92, 138, 0.4);
            border-radius: 16px;
            padding: 16px;
            font-size: 0.78rem;
            color: #d1d1d6;
            line-height: 1.5;
        }
        .destaque-card strong {
            color: #ff5c8a;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">← Voltar</a>
        <div style="clear: both;"></div>
        
        <div class="header">
            <h1>📊 NossoS  Dados</h1>
            <p>O resumo perfeito da nossa história até agora.</p>
        </div>

        <div class="stats-grid">
            <!-- Cartão 1: Dias Juntos (Calculado Automaticamente) -->
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-value" id="diasJuntos">--</div>
                <div class="stat-label">Dias Juntos</div>
            </div>

            <!-- Cartão 2: Sorrisos gerados -->
            <div class="stat-card">
                <div class="stat-icon">✨</div>
                <div class="stat-value">∞</div>
                <div class="stat-label">Sorrisos Diários</div>
            </div>

            <!-- Cartão 3: Mensagens Trocadas (Estimativa ou número real) -->
            <div class="stat-card">
                <div class="stat-icon">💬</div>
                <div class="stat-value">20k+</div>
                <div class="stat-label">Mensagens</div>
            </div>

            <!-- Cartão 4: Filmes / Séries Vistos -->
            <div class="stat-card">
                <div class="stat-icon">🍿</div>
                <div class="stat-value">14+</div>
                <div class="stat-label">Encontros </div>
            </div>

            <!-- Cartão 5 Largo: Músicas Nossas -->
            <div class="stat-card full-width">
                <div class="stat-icon">🎵</div>
                <div class="stat-value">"A musica que voce me lembra tua voz "</div>
                <div class="stat-label">PERMANECEREI</div>
            </div>
        </div>

        <div class="destaque-card">
            <p>💡 <strong>Sabias que?</strong> Que tu és muito incrivel.</p>
        </div>
    </div>

    <script>
        // Põe aqui a data em que começaram a namorar (Ano, Mês-1, Dia)
        // Nota: Janeiro é 0, Fevereiro é 1, Março é 2, etc. Exemplo: 15 de Outubro de 2023 seria new Date(2023, 9, 15)
        const dataInicio = new Date(2026, 0, 8); // Altera para a vossa data real!

        function calcularDias() {
            const hoje = new Date();
            const diferencaTempo = hoje - dataInicio;
            const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));
            
            document.getElementById("diasJuntos").innerText = diferencaDias > 0 ? diferencaDias : "1+";
        }

        calcularDias();
    </script>
</body>
</html>
